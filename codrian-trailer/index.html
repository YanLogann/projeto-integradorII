<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CODRIAN | The Digital Apocalypse</title>
<link rel="stylesheet" href="src/styles/fonts.css">
<link rel="stylesheet" href="src/styles/main.css">
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/",
  "gsap": "./node_modules/gsap/index.js"
} }
</script>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <canvas id="gl" width="1080" height="1920"></canvas>
    <canvas id="fx2d"></canvas>
    <div id="scenes"></div>
    <div id="caption"></div>
    <div id="flash"></div>
  </div>
</div>
<div id="controls">
  <button id="play">▶ Play</button>
  <input id="scrub" type="range" min="0" max="40" step="0.0333333" value="0">
  <span id="clock">0.00 / 40.00</span>
  <label><input id="sound" type="checkbox" checked> som</label>
  <span id="status">carregando…</span>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
