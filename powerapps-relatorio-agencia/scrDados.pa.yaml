# Tela 1: escolha da agência e de quem faz o relatório
Screens:
  scrDados:
    Properties:
      Fill: =RGBA(245, 246, 248, 1)
    Children:
      - lblTitulo1:
          Control: Label@2.5.1
          Properties:
            Text: ="Relatório de Agência - Dados"
            X: =20
            Y: =20
            Width: =Parent.Width - 40
            Height: =50
            Size: =20
            FontWeight: =FontWeight.Bold
      - lblAgencia:
          Control: Label@2.5.1
          Properties:
            Text: ="Agência"
            X: =20
            Y: =90
            Width: =Parent.Width - 40
            Height: =30
      - ddAgencia:
          Control: Classic/DropDown@2.3.1
          Properties:
            Items: =Agencias
            Default: =Blank()
            AllowEmptySelection: =true
            X: =20
            Y: =120
            Width: =Parent.Width - 40
            Height: =45
            OnChange: =Set(varAgencia, Self.Selected.Value)
      - lblRelator:
          Control: Label@2.5.1
          Properties:
            Text: ="Responsável pelo relatório"
            X: =20
            Y: =185
            Width: =Parent.Width - 40
            Height: =30
      - cbRelator:
          Control: Classic/ComboBox@2.4.0
          Properties:
            # Busca na base de usuários do tenant (conector Office 365 Users)
            Items: =Office365Users.SearchUserV2({searchTerm: Self.SearchText, top: 25}).value
            IsSearchable: =true
            SelectMultiple: =false
            DisplayFields: =["DisplayName"]
            SearchFields: =["DisplayName", "Mail"]
            DefaultSelectedItems: =[Office365Users.MyProfileV2()]
            X: =20
            Y: =215
            Width: =Parent.Width - 40
            Height: =45
      - btnProximo1:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Próximo"
            X: =20
            Y: =Parent.Height - 80
            Width: =Parent.Width - 40
            Height: =50
            DisplayMode: =If(IsBlank(ddAgencia.Selected.Value) || IsBlank(cbRelator.Selected), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =Set(varAgencia, ddAgencia.Selected.Value);
              Set(varRelator, cbRelator.Selected);
              Navigate(scrFotos, ScreenTransition.Cover)
